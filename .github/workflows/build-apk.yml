name: Build Android APK

on:
  push:
    branches:
      - Kryptocasino
  workflow_dispatch:

concurrency:
  group: citv-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build CITV Slot Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Verify dist folder
        run: |
          test -f dist/index.html && echo "index.html EXISTS" || (echo "index.html MISSING" && exit 1)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Ensure Gradle wrapper jar
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — downloading official Gradle 8.2.1 wrapper"
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar"
          fi
          test -s android/gradle/wrapper/gradle-wrapper.jar
          ls -lh android/gradle/wrapper/
          chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon -x lint

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: citv-slot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete existing latest-debug release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-debug --yes --cleanup-tag || true
        continue-on-error: true

      - name: Create latest-debug GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-debug \
            --title "CITV Slot Latest Debug Build" \
            --notes "CITV Slot debug APK (\`Kryptocasino\`).\n\n**Commit:** \`${{ github.sha }}\`\n**Built at:** $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --target ${{ github.sha }} \
            android/app/build/outputs/apk/debug/app-debug.apk
