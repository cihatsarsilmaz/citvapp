name: Validate npm publish workflow syntax and quality
on:
  pull_request:
    paths:
      - '.github/workflows/npm-publish.yml'
      - '.github/workflows/validate-npm-publish.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse YAML and assert release-only publication
        shell: bash
        run: |
          ruby -rpsych -e '
            file = ".github/workflows/npm-publish.yml"
            doc = Psych.safe_load(File.read(file), permitted_classes: [], aliases: false)
            abort "Not a workflow mapping" unless doc.is_a?(Hash)
            events = doc.fetch("on") { doc.fetch(true, nil) }
            abort "Publish must be release-only" unless events.is_a?(Hash) && events.keys == ["release"]
            abort "Missing published release trigger" unless events.fetch("release").fetch("types") == ["published"]
            jobs = doc.fetch("jobs")
            abort "Missing validation job" unless jobs.key?("validate")
            abort "Missing publish job" unless jobs.key?("build-and-publish")
            puts "YAML parsed; release-only publication trigger verified"
          '
      - name: Validate package metadata and registry
        shell: bash
        run: |
          jq -e '.name == "@cihatsarsilmaz/citv-slot"' package.json
          jq -e '.private == false' package.json
          jq -e '.publishConfig.registry == "https://npm.pkg.github.com"' package.json
          jq -e '.version | type == "string" and length > 0' package.json

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build web assets
        run: npm run build
      - name: Validate package tarball without publishing
        run: npm pack --dry-run --json > /tmp/npm-pack-report.json
      - name: Verify tarball contents
        shell: bash
        run: |
          jq -e 'length == 1 and (.[0].files | length > 0)' /tmp/npm-pack-report.json
          echo "Dry-run package inspection completed; nothing was published"
      - name: Write CI evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Publish workflow quality gate"
            echo "- Commit: $GITHUB_SHA"
            echo "- npm publish: NOT EXECUTED"
            echo "- Merge/deployment: NOT EXECUTED"
          } >> "$GITHUB_STEP_SUMMARY"
